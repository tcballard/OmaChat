[advisories]
yanked = "deny"
# secret-service 5.2.0 depends on zbus 5. RUSTSEC-2026-0370, 0371, and 0372
# are unmaintained notices and list no patched release.
ignore = [
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # k256 0.13.4 requires crypto-bigint 0.5. RUSTSEC-2026-0387 is fixed on
    # crypto-bigint 0.7, which that k256 release does not accept.
    "RUSTSEC-2026-0387",
]

[bans]
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards = "deny"
highlight = "all"

[licenses]
confidence-threshold = 0.93
include-dev = true
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[[licenses.exceptions]]
name = "foldhash"
allow = ["Zlib"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[[licenses.exceptions]]
name = "foldhash"
allow = ["Zlib"]
