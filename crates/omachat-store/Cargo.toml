[package]
name = "omachat-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chacha20poly1305 = "=0.10.1"
getrandom = "=0.4.3"
hex = "=0.4.3"
omachat-crypto = { path = "../omachat-crypto", version = "=0.0.1" }
omachat-nostr = { path = "../omachat-nostr", version = "=0.0.1" }
omachat-registry = { path = "../omachat-registry", version = "=0.0.1" }
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["sync", "time"] }
zeroize = "=1.9.0"

[dev-dependencies]
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }

[lints]
workspace = true
