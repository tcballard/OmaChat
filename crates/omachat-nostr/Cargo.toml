[package]
name = "omachat-nostr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "=0.22.1"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
hex = "=0.4.3"
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }
omachat-crypto = { path = "../omachat-crypto", version = "=0.0.1" }
omachat-proto = { path = "../omachat-proto", version = "=0.0.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-socks = "=0.5.3"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "=2.5.8"
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
rcgen = "=0.14.10"
rustls = { version = "=0.23.35", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }

[lints]
workspace = true
