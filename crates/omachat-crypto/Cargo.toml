[package]
name = "omachat-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "=0.22.1"
chacha20 = "=0.9.1"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = "=2.2.0"
getrandom = "=0.4.3"
hex = "=0.4.3"
hkdf = "=0.12.4"
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "schnorr", "std"] }
hmac = "=0.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = { version = "=1.9.0", features = ["derive"] }
x25519-dalek = "=2.0.1"

[lints]
workspace = true
