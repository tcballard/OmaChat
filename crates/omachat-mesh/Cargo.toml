[package]
name = "omachat-mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bluer = { version = "=0.17.4", features = ["bluetoothd"] }
chacha20poly1305 = "=0.10.1"
dbus = { version = "=0.9.12", features = ["vendored"] }
ed25519-dalek = "=2.2.0"
flate2 = "=1.1.10"
hmac = "=0.12.1"
futures = "=0.3.34"
hex = "=0.4.3"
omachat-proto = { path = "../omachat-proto", version = "=0.0.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
x25519-dalek = "=2.0.1"
zeroize = "=1.9.0"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]

