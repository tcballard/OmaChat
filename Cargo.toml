[workspace]
resolver = "3"
members = [
    "crates/omachat-proto",
    "crates/omachat-crypto",
    "crates/omachat-nostr",
    "crates/omachat-server",
    "crates/omachat-store",
    "crates/omachatd",
    "crates/omachat-ctl",
    "crates/omachat-tui",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "0BSD"
repository = "https://github.com/tcballard/OmaChat"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
