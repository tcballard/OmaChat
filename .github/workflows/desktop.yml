name: Desktop client
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop:
    name: Desktop protocol, state and Qt interaction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install offscreen Qt test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python3 -m venv /tmp/omachat-qt-tests
          /tmp/omachat-qt-tests/bin/pip install PySide6==6.8.3
      - name: Protocol, real Unix socket, and Qt interaction checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/omachat-qt-tests/bin/python -m unittest discover -s desktop/tests -p 'test_*.py' -v
      - name: Presentation state regressions
        run: |
          node desktop/tests/test_state.js
          node desktop/tests/test_contact.js
          node desktop/tests/test_drafts.js
          node desktop/tests/test_hosted.js
      - name: Launcher syntax
        run: sh -n desktop/omachat-desktop
