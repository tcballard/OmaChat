name: G0 portable probes

on:
  pull_request:
    paths:
      - .github/workflows/g0-probes.yml
      - Cargo.lock
      - crates/omachat-mesh/**
      - crates/omachat-nostr/**
      - crates/omachat-store/**
      - conformance/georelays/**
      - conformance/probes/**
      - docs/adr/**
      - docs/g0/**

permissions:
  contents: read

concurrency:
  group: g0-probes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Georelay, storage, and transport proofs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: clippy

      - name: Run portable G0 tests
        run: cargo test -p omachat-nostr -p omachat-store --all-targets --locked

      - name: Compile-check BlueR qualification probe
        run: cargo clippy -p omachat-mesh --example bluer_dual_role_probe --locked -- -D warnings

      - name: Compile-check feature-gated Arti probe
        run: cargo clippy --manifest-path conformance/probes/arti/Cargo.toml --locked -- -D warnings
