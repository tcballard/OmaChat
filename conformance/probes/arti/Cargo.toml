[package]
name = "omachat-g0-arti-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "0BSD"
publish = false

[dependencies]
arti-client = { version = "=0.45.0", default-features = false, features = ["compression", "rustls", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }

# This probe is intentionally a standalone package. Its experimental Arti
# graph must never enter OmaChat's production workspace or root lockfile.
[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
